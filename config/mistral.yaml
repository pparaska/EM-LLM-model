verbose: false
compute_ppl: true
return_block_size: true
logging: true
em_splitter: surprisal

max_len: 16384
max_gen: 256
chunk_size: 256
conv_type: mistral-inst
extended_passkey: 1024

model:
  type: em-llm
  path: mistralai/Mistral-7B-Instruct-v0.2

  # --- Your Cross-Event Reasoner ---
  cross_event_alpha_query: 0.9

  # --- Event Segmentation ---
  min_block_size: 16          # ↑ bigger events help narrative understanding
  max_block_size: 64
  repr_topk: 4                # ↑ essential for good retrieval

  # --- Memory Configuration (VERY IMPORTANT) ---
  n_init: 128                 # ↑ narrative needs more warmup context
  n_local: 2048               # ↑ Large local context (critical)
  n_mem: 1024                 # ↑ Must be >= 1024 for NarrativeQA
  max_cached_block: 256       # ↑ more blocks stored

  exc_block_size: 512
  base: 1000000
  distance_scale: 1.0
  surprisal_threshold_gamma: 1.0

  # --- Offloading ---
  min_free_cpu_memory: 50
  disk_offload_threshold: 50000
  vector_offload_threshold: 5000

  # --- Similarity Refinement (ON improves NarrativeQA by 3–4 points) ---
  similarity_refinement_kwargs:
    similarity_refinement: true
    refine_with_buffer: true
    refine_from_layer: 20
    similarity_metric: modularity

  # --- Contiguity Buffer (OFF improves Narrative tasks) ---
  contiguity_buffer_kwargs:
    use_contiguity_buffer: false
    contiguity_buffer_size: 0.3

  uniform_blocks: false
  random_topk_blocks: false
